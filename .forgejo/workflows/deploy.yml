name: Deploy mokuji

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build binary
        run: make build-linux-amd64

      - name: Deploy to mimir
        run: sudo /usr/local/bin/mokuji-deploy "$(pwd)/bin/mokuji-linux-amd64"
