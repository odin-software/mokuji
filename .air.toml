root = "."
tmp_dir = "tmp"

[build]
  # Inyecta la versión leída de ./VERSION con sufijo -dev para distinguir
  # builds locales de los deployados en producción (que no llevan sufijo).
  cmd = "go build -ldflags=\"-X github.com/odin-software/mokuji/internal/version.Value=$(cat VERSION)-dev\" -o ./tmp/mokuji ."
  bin = "./tmp/mokuji"
  delay = 500
  exclude_dir = ["tmp", "bin", "data", "docs", "node_modules", "vendor"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "html", "sql", "txt", "css", "js"]
  kill_delay = "5s"
  send_interrupt = true
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = true
