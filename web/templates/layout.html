{{define "layout"}}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}mokuji{{end}}</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  max-width: 28rem;
  margin: 4rem auto;
  padding: 0 1rem;
  line-height: 1.6;
  color: #222;
}
h1 { margin: 0 0 1rem; font-weight: 600; font-size: 1.5rem; }
form { display: grid; gap: 0.75rem; }
label { display: grid; gap: 0.25rem; font-size: 0.875rem; color: #444; }
input {
  padding: 0.625rem 0.75rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 1rem;
  font-family: inherit;
}
input:focus { outline: 2px solid #222; outline-offset: 1px; border-color: #222; }
button {
  padding: 0.625rem 1rem;
  background: #222;
  color: white;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1rem;
  font-family: inherit;
}
button:hover { background: #000; }
.error {
  padding: 0.5rem 0.75rem;
  background: #fee;
  border-left: 3px solid #b00;
  color: #722;
  border-radius: 4px;
  margin-bottom: 1rem;
}
.muted { color: #666; font-size: 0.875rem; }
a { color: inherit; }
</style>
</head>
<body>
{{block "content" .}}<p>contenido vacío</p>{{end}}
</body>
</html>{{end}}
