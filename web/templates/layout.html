{{define "layout"}}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}mokuji{{end}}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="theme-color" content="#222222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="mokuji">
<script src="/static/app.js" defer></script>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --text: #222222;
  --text-muted: #666666;
  --text-label: #444444;
  --border: #dddddd;
  --border-strong: #cccccc;
  --border-soft: #eeeeee;
  --input-bg: #ffffff;
  --details-bg: #fafafa;
  --button-bg: #222222;
  --button-bg-hover: #000000;
  --button-fg: #ffffff;
  --logout-hover-bg: #f0f0f0;
  --error-bg: #ffeded;
  --error-border: #b00000;
  --error-text: #722;
  --status-reading-bg: #cde4ff;
  --status-reading-fg: #003a75;
  --status-planned-bg: #f0e4ff;
  --status-planned-fg: #4b0082;
  --status-completed-bg: #d4edda;
  --status-completed-fg: #155724;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #181818;
    --text: #e8e8e8;
    --text-muted: #aaaaaa;
    --text-label: #c8c8c8;
    --border: #333333;
    --border-strong: #444444;
    --border-soft: #2a2a2a;
    --input-bg: #1f1f1f;
    --details-bg: #1f1f1f;
    --button-bg: #ffffff;
    --button-bg-hover: #cccccc;
    --button-fg: #111111;
    --logout-hover-bg: #2a2a2a;
    --error-bg: #3a1a1a;
    --error-border: #d33;
    --error-text: #fcc;
    /* Badges: oscurecemos los backgrounds claros para que no quemen
       en dark mode, manteniendo legibilidad */
    --status-reading-bg: #1a3a5c;
    --status-reading-fg: #cde4ff;
    --status-planned-bg: #3a1a5c;
    --status-planned-fg: #f0e4ff;
    --status-completed-bg: #1a3a1f;
    --status-completed-fg: #d4edda;
  }
}

* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  max-width: 40rem;
  margin: 3rem auto;
  padding: 0 1rem;
  line-height: 1.6;
  background: var(--bg);
  color: var(--text);
}
h1 { margin: 0 0 1rem; font-weight: 600; font-size: 1.5rem; }
form { display: grid; gap: 0.75rem; }
label { display: grid; gap: 0.25rem; font-size: 0.875rem; color: var(--text-label); }
input {
  padding: 0.625rem 0.75rem;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  font-size: 1rem;
  font-family: inherit;
  background: var(--input-bg);
  color: var(--text);
}
input:focus { outline: 2px solid var(--text); outline-offset: 1px; border-color: var(--text); }
button {
  padding: 0.625rem 1rem;
  background: var(--button-bg);
  color: var(--button-fg);
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1rem;
  font-family: inherit;
}
button:hover { background: var(--button-bg-hover); }
.error {
  padding: 0.5rem 0.75rem;
  background: var(--error-bg);
  border-left: 3px solid var(--error-border);
  color: var(--error-text);
  border-radius: 4px;
  margin-bottom: 1rem;
}
.muted { color: var(--text-muted); font-size: 0.875rem; }
a { color: inherit; }
select, textarea {
  padding: 0.625rem 0.75rem;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  font-size: 1rem;
  font-family: inherit;
  background: var(--input-bg);
  color: var(--text);
}
textarea { resize: vertical; }
.lib-header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.lib-filters { display: flex; gap: 0.5rem; margin: 1rem 0 1.5rem; align-items: center; }
.lib-filters input[type="search"] { flex: 1; }
.action-link {
  display: inline-block;
  padding: 0.5rem 1rem;
  background: var(--button-bg);
  color: var(--button-fg);
  text-decoration: none;
  border-radius: 4px;
  font-size: 0.875rem;
}
.action-link:hover { background: var(--button-bg-hover); }
.manga-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.5rem; }
.manga-list details { border: 1px solid var(--border); border-radius: 4px; padding: 0.5rem 0.75rem; }
.manga-list summary { cursor: pointer; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.manga-list summary .cover { border-radius: 2px; flex-shrink: 0; }
.manga-list summary strong { margin-right: 0.25rem; }
.manga-list details[open] { background: var(--details-bg); padding-bottom: 0.75rem; }
.entry-form { margin-top: 0.75rem; }
.entry-source-link { margin: 0.75rem 0 0; }
.delete-form { margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px solid var(--border-soft); }
.status {
  display: inline-block;
  padding: 0.125rem 0.5rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
}
.status-reading { background: var(--status-reading-bg); color: var(--status-reading-fg); }
.status-planned { background: var(--status-planned-bg); color: var(--status-planned-fg); }
.status-completed { background: var(--status-completed-bg); color: var(--status-completed-fg); }
.favorite { color: #f5a623; font-size: 1.1rem; line-height: 1; }
.checkbox {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
}
.checkbox input { width: auto; padding: 0; margin: 0; flex-shrink: 0; }
button.danger { background: #b00; color: #fff; }
button.danger:hover { background: #800; }
.search-form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
.search-form input[type="search"] { flex: 1; }
.search-results { list-style: none; padding: 0; margin: 0; display: grid; gap: 1rem; }
.search-results .result {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 1rem;
  padding: 0.75rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  align-items: start;
}
.search-results .result img { border-radius: 4px; }
.search-results .info p { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.4; max-height: 5.6em; overflow: hidden; color: var(--text); }
.search-results .info strong { color: var(--text); }
.logout-form { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border-soft); }
.logout-form button { background: transparent; color: inherit; border: 1px solid var(--border-strong); padding: 0.375rem 0.75rem; font-size: 0.875rem; }
.logout-form button:hover { background: var(--logout-hover-bg); }
.user-links { margin-top: 2rem; font-size: 0.875rem; color: var(--text-muted); }
.user-links .sep { margin: 0 0.5rem; }
.user-links a { color: inherit; }
.settings-section { border: 1px solid var(--border); border-radius: 4px; padding: 1rem; margin: 0 0 1rem; display: grid; gap: 0.75rem; }
.settings-section legend { padding: 0 0.5rem; font-weight: 600; }
.radio {
  display: flex;
  flex-direction: row;
  align-items: start;
  gap: 0.5rem;
  cursor: pointer;
}
.radio input { width: auto; padding: 0; margin: 0.25rem 0 0; flex-shrink: 0; }
.radio > span { display: flex; flex-direction: column; gap: 0.125rem; }
.radio code { background: var(--border-soft); padding: 0 0.25rem; border-radius: 2px; font-size: 0.8125rem; }
.success {
  padding: 0.5rem 0.75rem;
  background: var(--status-completed-bg);
  border-left: 3px solid #2a8;
  color: var(--status-completed-fg);
  border-radius: 4px;
  margin-bottom: 1rem;
}
.public-entry {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 4px;
}
.public-entry .cover { border-radius: 2px; flex-shrink: 0; }
.release-list { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: 0.75rem; }
.release {
  display: grid;
  grid-template-columns: 48px 1fr auto;
  gap: 0.75rem;
  align-items: center;
  padding: 0.625rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 4px;
}
.release .cover { border-radius: 2px; flex-shrink: 0; }
.release-info { min-width: 0; }
.release-info strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.release-meta { font-size: 0.875rem; }
.release-meta > span:not(:first-child) { margin-left: 0.25rem; }
.release-actions { display: flex; flex-direction: column; gap: 0.375rem; align-items: flex-end; }
.inline-form { display: inline; margin: 0; }
.link-button {
  background: none;
  border: 0;
  padding: 0;
  font-size: 0.8125rem;
  color: var(--text-muted);
  cursor: pointer;
  text-decoration: underline;
  font-family: inherit;
}
.link-button:hover { color: var(--text); background: none; }
.app-footer {
  margin: 3rem 0 0;
  padding-top: 1rem;
  border-top: 1px solid var(--border-soft);
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-muted);
}
.app-footer a { color: inherit; }
</style>
</head>
<body>
{{block "content" .}}<p>contenido vacío</p>{{end}}
<footer class="app-footer">mokuji <a href="/version">{{appVersion}}</a></footer>
</body>
</html>{{end}}
