{{define "layout"}}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}mokuji{{end}}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="theme-color" content="#222222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="mokuji">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  max-width: 40rem;
  margin: 3rem auto;
  padding: 0 1rem;
  line-height: 1.6;
  color: #222;
}
h1 { margin: 0 0 1rem; font-weight: 600; font-size: 1.5rem; }
form { display: grid; gap: 0.75rem; }
label { display: grid; gap: 0.25rem; font-size: 0.875rem; color: #444; }
input {
  padding: 0.625rem 0.75rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 1rem;
  font-family: inherit;
}
input:focus { outline: 2px solid #222; outline-offset: 1px; border-color: #222; }
button {
  padding: 0.625rem 1rem;
  background: #222;
  color: white;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1rem;
  font-family: inherit;
}
button:hover { background: #000; }
.error {
  padding: 0.5rem 0.75rem;
  background: #fee;
  border-left: 3px solid #b00;
  color: #722;
  border-radius: 4px;
  margin-bottom: 1rem;
}
.muted { color: #666; font-size: 0.875rem; }
a { color: inherit; }
select, textarea {
  padding: 0.625rem 0.75rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 1rem;
  font-family: inherit;
}
select { background: white; }
textarea { resize: vertical; }
.lib-header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.lib-filters { display: flex; gap: 0.5rem; margin: 1rem 0 1.5rem; align-items: center; }
.lib-filters input[type="search"] { flex: 1; }
.action-link {
  display: inline-block;
  padding: 0.5rem 1rem;
  background: #222;
  color: white;
  text-decoration: none;
  border-radius: 4px;
  font-size: 0.875rem;
}
.action-link:hover { background: #000; }
.manga-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.5rem; }
.manga-list details { border: 1px solid #ddd; border-radius: 4px; padding: 0.5rem 0.75rem; }
.manga-list summary { cursor: pointer; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.manga-list summary .cover { border-radius: 2px; flex-shrink: 0; }
.manga-list summary strong { margin-right: 0.25rem; }
.manga-list details[open] { background: #fafafa; padding-bottom: 0.75rem; }
.entry-form { margin-top: 0.75rem; }
.entry-source-link { margin: 0.75rem 0 0; }
.delete-form { margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px solid #eee; }
.status {
  display: inline-block;
  padding: 0.125rem 0.5rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
}
.status-reading { background: #cde4ff; color: #003a75; }
.status-planned { background: #f0e4ff; color: #4b0082; }
.status-completed { background: #d4edda; color: #155724; }
.favorite { color: #f5a623; font-size: 1.1rem; line-height: 1; }
.checkbox { flex-direction: row !important; align-items: center; gap: 0.5rem; }
.checkbox input { width: auto; padding: 0; margin: 0; }
button.danger { background: #b00; }
button.danger:hover { background: #800; }
.search-form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
.search-form input[type="search"] { flex: 1; }
.search-results { list-style: none; padding: 0; margin: 0; display: grid; gap: 1rem; }
.search-results .result {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 1rem;
  padding: 0.75rem;
  border: 1px solid #ddd;
  border-radius: 4px;
  align-items: start;
}
.search-results .result img { border-radius: 4px; }
.search-results .info p { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.4; max-height: 5.6em; overflow: hidden; }
.logout-form { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #eee; }
.logout-form button { background: transparent; color: inherit; border: 1px solid #ccc; padding: 0.375rem 0.75rem; font-size: 0.875rem; }
.logout-form button:hover { background: #f0f0f0; }
</style>
</head>
<body>
{{block "content" .}}<p>contenido vacío</p>{{end}}
</body>
</html>{{end}}
